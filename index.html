<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeRakau Games</title>
<meta name="description" content="Mobile games by TeRakau.">
<style>
:root{--bg:#0c0628;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--text:#f2f0ff;--muted:#b6aee0;--accent:#7ef9ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0c0628,#2e1060);color:var(--text);font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:56px 16px}
h1{margin:0 0 4px;font-size:clamp(32px,7vw,48px);letter-spacing:1px}
.sub{margin:0 0 40px;color:var(--muted)}
.game{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.game img{width:84px;height:84px;border-radius:20px;flex:none}
.game h2{margin:0;font-size:22px}
.game p{margin:4px 0 8px;color:var(--muted)}
a{color:var(--accent)}
footer{margin-top:48px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>TeRakau Games</h1>
  <p class="sub">Mobile games by TeRakau.</p>

  <section class="game">
    <img src="comethop/icon.png" alt="Comet Hop icon">
    <div>
      <h2>Comet Hop</h2>
      <p>One-tap arcade game: slingshot your comet from planet to planet. Android.</p>
      <a href="comethop/privacy-policy.html">Privacy policy</a>
    </div>
  </section>

  <footer>© 2026 TeRakau</footer>
</main>
</body>
</html>
